# The supplied Russian retail disc has a different executable layout from GOTY.
# Discover its functions from this executable; never reuse the GOTY address map.
[project]
name = "fable_2"
sdk_version = "0.10.0"
game_root = "../.."

[entrypoint]
file_path = "../../default.xex"
out_directory_path = "../../generated/retail"
includes = []

# Retail CRT jump-buffer routines, verified by their register save/restore
# sequences in the decoded XEX. Calls must unwind the native C++ stack too.
setjmp_address = 0x82FBC310
longjmp_address = 0x82C6C7E0

# Tail-call entry points reported by validation of retail 0.0.0.8.
[entrypoint.functions."0x82BDD940"]
[entrypoint.functions."0x82BC7238"]
[entrypoint.functions."0x82BC7248"]
[entrypoint.functions."0x82BC7258"]
[entrypoint.functions."0x82E3AF10"]
[entrypoint.functions."0x82BC7260"]
[entrypoint.functions."0x82BC7250"]
[entrypoint.functions."0x82BD3E68"]
[entrypoint.functions."0x82BC7268"]
[entrypoint.functions."0x82BD3E70"]
[entrypoint.functions."0x82BD3E78"]

